[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvbaharness"
version = "0.4.0"
description = "Hang-resistant Python harness for running and validating VBA in desktop Excel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "William Smith Edward" }]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
fuzz = [
    "hypothesis>=6",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[project.entry-points.pytest11]
pyvbaharness = "pyvbaharness.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a real desktop Excel installation (deselected by default)",
]
addopts = "-m 'not live'"
# This repo's own suite tests the plugin through pytester; collecting .bas
# fixtures at the top level would need Excel for a unit run.
vba_collect = false
