[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvbaharness"
version = "0.4.0"
description = "Hang-resistant Python harness for running and validating VBA in desktop Excel"
readme = "README.md"
requires-python = ">=3.10"
# SPDX expression per PEP 639. Do not add a "License ::" classifier
# alongside it; setuptools rejects the combination.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Smith Edward" }]
keywords = [
    "excel", "vba", "automation", "com", "testing", "pytest",
    "macro", "xlsm", "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/WilliamSmithEdward/pyVBAharness"
Repository = "https://github.com/WilliamSmithEdward/pyVBAharness"
Issues = "https://github.com/WilliamSmithEdward/pyVBAharness/issues"
Documentation = "https://github.com/WilliamSmithEdward/pyVBAharness#readme"

[project.optional-dependencies]
fuzz = [
    "hypothesis>=6",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "build>=1",
    "twine>=5",
]

[project.scripts]
pyvbaharness = "pyvbaharness.__main__:main"

[project.entry-points.pytest11]
pyvbaharness = "pyvbaharness.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a real desktop Excel installation (deselected by default)",
]
addopts = "-m 'not live'"
# This repo's own suite tests the plugin through pytester; collecting .bas
# fixtures at the top level would need Excel for a unit run.
vba_collect = false
