version: 2

# Every pin in the repository that a tool can follow is followed from here.
# The exception is a GitHub release download (YARA-X and its rules, pinned
# in .github/security/pins.json), which .github/workflows/update-yara-rules.yml
# follows instead.
#
# A seven-day cooldown throughout: a release is adopted once it is a week old,
# which is long enough for a bad or compromised one to be noticed and pulled.
# Security updates ignore the cooldown, which is what they should do.

updates:
  # Workflow actions, pinned to commit SHAs with the version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The package's own dependencies. This is a library, so a floor in
  # pyproject.toml is a compatibility claim, not a pin: raise it only when
  # a new release falls outside the declared range.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary

  # Release and security tooling, hash-locked by uv from each <purpose>.in.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]

  # Scanner images, pinned by digest in one-line Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /.github/security/clamav
      - /.github/security/semgrep
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
