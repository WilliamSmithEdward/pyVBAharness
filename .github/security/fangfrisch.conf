# Free unofficial ClamAV signature feeds, fetched by fangfrisch on every
# malware scan alongside the official databases freshclam fetches. Only the
# providers that need no account: Sanesecurity and URLhaus publish SHA-256
# digests that fangfrisch verifies, InterServer publishes none. The paths
# are relative to the directory the workflow runs fangfrisch from.
[DEFAULT]
db_url = sqlite:///fangfrisch.sqlite
local_directory = clamdb
log_level = INFO

[sanesecurity]
enabled = yes

[interserver]
enabled = yes

[urlhaus]
enabled = yes
