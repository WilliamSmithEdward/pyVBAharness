name: Publish

# Publishing runs when a GitHub release is published. Authentication is
# PyPI Trusted Publishing (OIDC): no API token is stored in this
# repository. See docs/RELEASING.md for the one-time PyPI setup.
#
# The manual trigger builds and verifies without publishing, so a release
# candidate can be downloaded from the run and tested locally against real
# Excel before it is tagged.
#
# The security workflow runs as a gate: any finding stops the release before
# PyPI, and its report is attached to the GitHub release either way, so a
# blocked release says why.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"  # newest 3.12 with a Windows build; see ci.yml's matrix note

      - name: Install
        # build and twine from .github/release/requirements.txt; the test
        # dependencies from their declared ranges, as in ci.yml.
        run: |
          python -m pip install -r .github/release/requirements.txt
          python -m pip install -e ".[dev,fuzz]"

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Check the release tag matches the project version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          # Through the environment rather than interpolated into the script,
          # so a tag name can never be parsed as PowerShell.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          $tag = $env:RELEASE_TAG -replace '^v', ''
          if ($tag -ne $version) {
            throw "Release tag '$tag' does not match project version '$version'. Bump pyproject.toml and src/pyvbaharness/__init__.py together, then retag."
          }
          Write-Output "Tag and version agree: $version"

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify the wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel.Name.EndsWith("py3-none-any.whl")) {
            throw "Expected a universal wheel, got $($wheel.Name)"
          }
          python -m venv .verify
          $py = ".verify\Scripts\python.exe"
          & $py -m pip install --quiet $wheel.FullName
          & $py -c "import pyvbaharness; print('version', pyvbaharness.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "The built wheel does not import" }
          & $py -m pyvbaharness doctor
          if ($LASTEXITCODE -notin 0, 2) { throw "doctor exited $LASTEXITCODE" }
          Write-Output "Verified $($wheel.Name)"
          # doctor's tolerated exit 2 is still sitting in $LASTEXITCODE, and
          # the pwsh step wrapper exits with whatever it finds there. Clear
          # it explicitly or the step fails after reporting success.
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  attach-security-report:
    # Runs whether or not the scans passed: a release blocked by a finding
    # should carry the report that blocked it.
    if: always() && github.event_name == 'release' && needs.security.result != 'skipped'
    needs: security
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" security-report.md --clobber --repo "$REPO"

  pypi:
    # Only a published release reaches PyPI, and only past a clean security
    # run. A manual run stops after the build job, leaving an artifact to
    # download and test.
    if: github.event_name == 'release'
    needs: [build, security]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyvbaharness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
