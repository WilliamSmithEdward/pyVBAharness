name: Publish

# Publishing runs when a GitHub release is published. Authentication is
# PyPI Trusted Publishing (OIDC): no API token is stored in this
# repository. See docs/RELEASING.md for the one-time PyPI setup.
#
# The manual trigger builds and verifies without publishing, so a release
# candidate can be downloaded from the run and tested locally against real
# Excel before it is tagged.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev,fuzz]"

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Check the release tag matches the project version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''
          if ($tag -ne $version) {
            throw "Release tag '$tag' does not match project version '$version'. Bump pyproject.toml and src/pyvbaharness/__init__.py together, then retag."
          }
          Write-Output "Tag and version agree: $version"

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify the wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel.Name.EndsWith("py3-none-any.whl")) {
            throw "Expected a universal wheel, got $($wheel.Name)"
          }
          python -m venv .verify
          $py = ".verify\Scripts\python.exe"
          & $py -m pip install --quiet $wheel.FullName
          & $py -c "import pyvbaharness; print('version', pyvbaharness.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "The built wheel does not import" }
          & $py -m pyvbaharness doctor
          if ($LASTEXITCODE -notin 0, 2) { throw "doctor exited $LASTEXITCODE" }
          Write-Output "Verified $($wheel.Name)"
          # doctor's tolerated exit 2 is still sitting in $LASTEXITCODE, and
          # the pwsh step wrapper exits with whatever it finds there. Clear
          # it explicitly or the step fails after reporting success.
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  pypi:
    # Only a published release reaches PyPI. A manual run stops after the
    # build job, leaving an artifact to download and test.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyvbaharness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
