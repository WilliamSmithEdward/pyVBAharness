name: Publish

# Publishing runs when a GitHub release is published. Authentication is
# PyPI Trusted Publishing (OIDC): no API token is stored in this
# repository. See docs/RELEASING.md for the one-time PyPI setup.
#
# Started by hand, this is always a dry run: it builds,
# verifies, runs the scans and assembles the release files exactly as a
# release would, and uploads them as the release-preview artifact instead of
# publishing anything, so a release candidate can be downloaded from the run
# and tested locally against real Excel before it is tagged.
#
# The security and malware scan workflows run as gates: any finding stops
# the release before PyPI, and their reports are attached to the GitHub
# release either way, so a blocked release says why.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"  # newest 3.12 with a Windows build; see ci.yml's matrix note

      - name: Install
        # build and twine from .github/requirements/release.txt; the test
        # dependencies from their declared ranges, as in ci.yml.
        run: |
          python -m pip install --require-hashes -r .github/requirements/release.txt
          python -m pip install -e ".[dev,fuzz]"

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Check the release tag matches the project version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          # Through the environment rather than interpolated into the script,
          # so a tag name can never be parsed as PowerShell.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          $tag = $env:RELEASE_TAG -replace '^v', ''
          if ($tag -ne $version) {
            throw "Release tag '$tag' does not match project version '$version'. Bump pyproject.toml and src/pyvbaharness/__init__.py together, then retag."
          }
          Write-Output "Tag and version agree: $version"

      - name: Build distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*

      - name: Verify the wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel.Name.EndsWith("py3-none-any.whl")) {
            throw "Expected a universal wheel, got $($wheel.Name)"
          }
          python -m venv .verify
          $py = ".verify\Scripts\python.exe"
          & $py -m pip install --quiet $wheel.FullName
          & $py -c "import pyvbaharness; print('version', pyvbaharness.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "The built wheel does not import" }
          & $py -m pyvbaharness doctor
          if ($LASTEXITCODE -notin 0, 2) { throw "doctor exited $LASTEXITCODE" }
          Write-Output "Verified $($wheel.Name)"
          # doctor's tolerated exit 2 is still sitting in $LASTEXITCODE, and
          # the pwsh step wrapper exits with whatever it finds there. Clear
          # it explicitly or the step fails after reporting success.
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  malware-scan:
    name: Malware scan
    uses: ./.github/workflows/malware-scan.yml

  publish:
    # Only a published release reaches PyPI, and only past clean security
    # and malware scan runs. A manual run stops after the build job, leaving an artifact to
    # download and test.
    name: Publish to PyPI
    if: ${{ github.event_name == 'release' }}
    needs: [build, security, malware-scan]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyvbaharness
    permissions:
      id-token: write
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # Signed build provenance: `gh attestation verify <file> --owner
      # WilliamSmithEdward` shows which commit and run built a distribution.
      - name: Attest the distributions
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # The signed bundle goes on the GitHub release too, so a download can be
      # checked offline: gh attestation verify <file> --bundle <bundle>.
      - name: Keep the provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach-reports:
    # Runs whether or not the scans passed: a release blocked by a finding
    # should carry the reports that blocked it.
    # On a dry run it keeps the reports, with the distributions, as the
    # release-preview artifact instead.
    name: Attach the reports
    if: >-
      ${{ always() && needs.security.result != 'skipped'
      && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    needs: [build, security, malware-scan, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: malware-report

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.DRY_RUN == 'true'
        with:
          name: distributions
          path: dist/
      - name: Keep what the release would carry
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            dist/
            security-report.md
            malware-report.md
          if-no-files-found: error
      # The bundle exists only when PyPI was published: a blocked release
      # still gets its reports, and no bundle.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.DRY_RUN != 'true' && needs.publish.result == 'success'
        with:
          name: provenance
          path: provenance/
      - name: Attach to the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          files="security-report.md malware-report.md"
          if [ -d provenance ]; then
            test "$(find provenance -type f | wc -l)" = 1
            bundle="pyvbaharness-${RELEASE_TAG#v}.sigstore.json"
            mv provenance/* "$bundle"
            files="$files $bundle"
          fi
          # shellcheck disable=SC2086 # the list is file names without spaces
          gh release upload "$RELEASE_TAG" $files --clobber --repo "$REPO"
