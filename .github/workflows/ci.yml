name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # Windows only: several modules bind user32/kernel32 through ctypes at
    # import time, so the package cannot even be imported elsewhere.
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        # Exact versions, so a runner image update cannot change them under
        # a green build. Nothing follows these; move them by hand to the
        # newest patch in actions/python-versions that is a week old and has
        # a win32 x64 build. Security-only releases ship no Windows builds,
        # so 3.10 to 3.12 stop at their last bugfix release here, while the
        # Linux jobs in security.yml can take the later patch.
        python-version: ["3.10.11", "3.11.9", "3.12.10", "3.13.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # The test dependencies resolve from the ranges pyproject.toml
        # declares, deliberately unpinned: this matrix exists to show the
        # package works with what a user installs today, across four
        # interpreters, and a lock would have to be kept per interpreter.
        run: python -m pip install -e ".[dev,fuzz]"

      - name: Unit tests
        # The live suite needs a real Excel installation, which hosted
        # runners do not have. It stays a local gate; see the note in the
        # build job summary.
        run: python -m pytest tests/unit -q

  build:
    name: Build
    runs-on: windows-2025
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"  # newest 3.12 with a Windows build; see the matrix note

      - name: Build distributions
        # build and twine, hash-pinned in .github/requirements/release.txt.
        run: |
          python -m pip install --require-hashes -r .github/requirements/release.txt
          python -m build
          python -m twine check dist/*

      - name: Verify wheel contents
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel.Name.EndsWith("py3-none-any.whl")) {
            throw "Expected a universal wheel, got $($wheel.Name)"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($wheel.FullName)
          $names = $zip.Entries.FullName
          $zip.Dispose()
          foreach ($required in @(
              "pyvbaharness/__init__.py",
              "pyvbaharness/pytest_plugin.py",
              "pyvbaharness/worker/__main__.py")) {
            if ($names -notcontains $required) {
              throw "Wheel is missing $required"
            }
          }
          if ($names | Where-Object { $_ -like "tests/*" }) {
            throw "Wheel must not ship the test suite"
          }
          Write-Output "Wheel contents verified: $($wheel.Name)"

      - name: Install and smoke-test the wheel in a clean environment
        shell: pwsh
        run: |
          python -m venv .verify
          $py = ".verify\Scripts\python.exe"
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          & $py -m pip install --quiet $wheel
          & $py -c "import pyvbaharness; print('version', pyvbaharness.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "The installed wheel does not import" }
          & $py -m pyvbaharness doctor
          # doctor reports 2 when the environment cannot host a run, which is
          # always true on a hosted runner (no Excel). Any other non-zero code
          # means the CLI itself is broken.
          if ($LASTEXITCODE -notin 0, 2) {
            throw "doctor exited $LASTEXITCODE"
          }
          & ".verify\Scripts\pyvbaharness.exe" doctor
          if ($LASTEXITCODE -notin 0, 2) {
            throw "console script exited $LASTEXITCODE"
          }
          Write-Output "Wheel installs, imports, and exposes its CLI"
          # doctor's tolerated exit 2 is still sitting in $LASTEXITCODE, and
          # the pwsh step wrapper exits with whatever it finds there. Clear
          # it explicitly or the step fails after reporting success.
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  ci-passed:
    # The one check the ruleset requires. Its name stays fixed while
    # the jobs above change, the matrix names included, which move whenever
    # a Python pin does. Anything short of every job succeeding fails it,
    # skipped included, since a skipped job did not pass.
    name: CI passed
    if: always()
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
