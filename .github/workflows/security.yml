name: Security

# Three independent scans, each of which fails the run on any finding:
#
#   CodeQL     security-extended queries for the Python and for these
#              workflow files
#   Semgrep    p/python, p/security-audit, p/secrets, p/github-actions
#   pip-audit  known vulnerabilities in the runtime dependency tree
#
# Publish calls this as a gate, so nothing reaches PyPI past a finding, and
# attaches the report job's output to the GitHub release. It also runs on
# every push and pull request, and weekly, because a new advisory can land
# against code that has not changed.
#
# Actions are pinned to commit SHAs, with the version they resolve to in a
# trailing comment; Dependabot proposes the bumps. Scanner versions are
# pinned in .github/security/requirements.txt for the same reason.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results

      - name: Fail on any finding
        # analyze uploads to code scanning and succeeds whatever it found.
        run: python3 .github/scripts/security_report.py gate codeql-results

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sec-codeql-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: ignore

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r .github/security/requirements.txt

      - name: Semgrep
        # --error fails the step on any finding. Parse warnings from the
        # PowerShell run blocks in the workflows are reported by Semgrep
        # but are not findings, and do not fail it.
        run: >-
          semgrep scan
          --config p/python
          --config p/security-audit
          --config p/secrets
          --config p/github-actions
          --metrics=off
          --error
          --sarif-output=semgrep.sarif
          --json-output=semgrep.json

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sec-semgrep
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: ignore

  dependencies:
    # Windows, because the only runtime dependency (pywin32) only resolves
    # there; auditing on Linux would audit a tree nobody installs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r .github/security/requirements.txt

      - name: Audit runtime dependencies
        # --strict also fails when a dependency cannot be audited at all,
        # which is not the same as having been audited and found clean.
        run: >-
          pip-audit --strict --progress-spinner off
          --format json --output pip-audit.json .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sec-pip-audit
          path: pip-audit.json
          if-no-files-found: ignore

  report:
    # Always runs, so a failed scan still produces a report saying so.
    if: always()
    needs: [codeql, semgrep, dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sec-*
          path: results

      - name: Write the report
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_CODEQL: ${{ needs.codeql.result }}
          JOB_SEMGREP: ${{ needs.semgrep.result }}
          JOB_DEPENDENCIES: ${{ needs.dependencies.result }}
        run: |
          python3 .github/scripts/security_report.py report results security-report.md \
            && status=0 || status=$?
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-report
          path: security-report.md
          if-no-files-found: error
