name: Security

# Independent scans, each of which fails the run on any finding:
#
#   CodeQL           security-extended queries, over the Python and over
#                    these workflow files
#   Semgrep          p/python, p/security-audit, p/secrets, p/github-actions
#   pip-audit        known vulnerabilities in the runtime dependency tree
#   zizmor           these workflow files, for template injection, credential
#                    persistence, over-broad permissions and the like
#
# ClamAV and YARA-X run in malware-scan.yml.
#
# Publish calls this as a gate, so nothing reaches PyPI past a finding, and
# attaches the report job's output to the GitHub release. It also runs on
# every push and pull request, and daily, because signatures and advisories
# change when the code does not.
#
# Pinning: actions by commit SHA with the version in a trailing comment;
# runners by OS release and Python by exact version; Semgrep and ClamAV by
# image digest (.github/security/*/Dockerfile); Python tools by hash
# (.github/requirements/*.txt); YARA-X and its rules by release and
# SHA-256 (.github/security/yara.json). Dependabot moves the actions, images
# and tools, and update-yara-rules.yml moves the release downloads. Nothing
# can follow runner labels or Python versions; move those by hand, as the
# note on ci.yml's matrix describes. Signatures are the exception: ClamAV's
# change many times a day, so freshclam brings them up to date and verifies
# them on every run, and the report records which versions were used.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results

      - name: Fail on any finding
        # analyze uploads to code scanning and succeeds whatever it found.
        run: python3 .github/scripts/security_report.py gate codeql-results

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sec-codeql-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: ignore

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep
        # --error fails the step on any finding. Parse warnings from the
        # PowerShell run blocks in the workflows are reported by Semgrep
        # but are not findings, and do not fail it.
        run: |
          docker build --quiet --tag pyvba-semgrep .github/security/semgrep
          docker run --rm --volume "$PWD:/src" --workdir /src pyvba-semgrep \
            semgrep scan \
              --config p/python \
              --config p/security-audit \
              --config p/secrets \
              --config p/github-actions \
              --metrics=off \
              --error \
              --sarif-output=semgrep.sarif \
              --json-output=semgrep.json

      - name: Drop findings suppressed in source
        # Semgrep writes a "# nosemgrep" finding into the SARIF, marked with
        # an inSource suppression, and code scanning raises an open alert
        # for it regardless. The suppression comment in the code is the
        # record of that decision, and --error above already honours it, so
        # code scanning gets the same set the gate judged: measured
        # 2026-09-30, pinned_release.py:52 passed the gate and stayed an
        # open alert. The full SARIF is still kept as an artifact.
        if: always() && hashFiles('semgrep.sarif') != ''
        run: >-
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))'
          semgrep.sarif > semgrep-unsuppressed.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('semgrep-unsuppressed.sarif') != ''
        with:
          sarif_file: semgrep-unsuppressed.sarif
          category: semgrep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sec-semgrep
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: ignore

  dependencies:
    name: Dependency audit
    # Windows, because the only runtime dependency (pywin32) only resolves
    # there; auditing on Linux would audit a tree nobody installs.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"  # newest 3.12 with a Windows build; see ci.yml's matrix note

      - name: Install
        # --no-deps: the lock already pins every dependency with a hash, so
        # pip installs exactly the lock and resolves nothing beyond it.
        run: python -m pip install --require-hashes --no-deps -r .github/requirements/pip-audit.txt

      - name: Audit runtime dependencies
        # --strict also fails when a dependency cannot be audited at all,
        # which is not the same as having been audited and found clean. The
        # package's own dependencies resolve from its declared ranges, as
        # they would for a user installing it today.
        run: >-
          pip-audit --strict --progress-spinner off
          --format json --output pip-audit.json .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sec-pip-audit
          path: pip-audit.json
          if-no-files-found: ignore

  # zizmor audits the workflows themselves: template injection, credential
  # persistence, over-broad permissions, dangerous triggers, and actions with
  # known advisories or impostor commits. Findings it should not raise are
  # turned off in .github/zizmor.yml or ignored inline, each with its reason;
  # anything else fails the job.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install zizmor
        run: python -m pip install --require-hashes -r .github/requirements/zizmor.txt

      # The token lets the online audits look up advisories and check that each
      # pinned SHA belongs to the action it names.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          zizmor --format sarif .github/workflows > zizmor.sarif || status=$?
          zizmor --format plain .github/workflows || true
          exit "$status"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  report:
    # Always runs, so a failed scan still produces a report saying so.
    name: Security report
    if: always()
    needs: [codeql, semgrep, dependencies]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sec-*
          path: results

      - name: Write the report
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_CODEQL: ${{ needs.codeql.result }}
          JOB_SEMGREP: ${{ needs.semgrep.result }}
          JOB_DEPENDENCIES: ${{ needs.dependencies.result }}
        run: |
          python3 .github/scripts/security_report.py report results security-report.md \
            && status=0 || status=$?
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-report
          path: security-report.md
          if-no-files-found: error

  security-passed:
    # The one check the ruleset requires from this workflow; see the same
    # job in ci.yml. It includes the report, so a report that could not be
    # written blocks a merge as surely as a finding does.
    name: Security passed
    if: always()
    needs: [codeql, semgrep, dependencies, zizmor, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
